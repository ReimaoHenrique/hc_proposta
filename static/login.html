<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HC Guardian — Acesso Restrito</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 360px;
      max-width: 92vw;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 3px solid #2c5364;
    }
    h1 { font-size: 20px; color: #0f2027; margin-bottom: 6px; }
    p { font-size: 13px; color: #5a6b78; margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d5dde3;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    input:focus { border-color: #2c5364; }
    button {
      width: 100%;
      padding: 12px;
      background: #2c5364;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d3a47; }
    .error {
      display: none;
      color: #c0392b;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .error.show { display: block; }
    .lock { font-size: 34px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/img/logo-hc.jpeg" alt="HC">
    <div class="lock">🔒</div>
    <h1>HC Guardian</h1>
    <p>Acesso restrito. Digite a senha para continuar.</p>
    <div class="error" id="error">Senha incorreta. Tente novamente.</div>
    <input type="password" id="password" placeholder="Senha" autocomplete="current-password" autofocus>
    <button id="loginBtn">Entrar</button>
  </div>

  <script>
    const PASSWORD_HASH = '62419208a6e1bf939f3686b615c6ed637987a39308b9112670bffb2e5bff2a5c';

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getNext() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      return next && next.startsWith('/') ? next : '/';
    }

    async function tryLogin() {
      const input = document.getElementById('password').value;
      if (!input) return;
      const hash = await sha256(input);
      if (hash === PASSWORD_HASH) {
        document.cookie = 'hc_auth=1; Path=/; SameSite=Lax; Max-Age=604800';
        window.location.replace(getNext());
      } else {
        document.getElementById('error').classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    document.getElementById('loginBtn').addEventListener('click', tryLogin);
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryLogin();
    });
  </script>
</body>
</html>
