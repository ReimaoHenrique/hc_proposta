              - separator [ref=f4e89]
              - paragraph [ref=f4e90]:
                - text: Um dos diferenciais da arquitetura proposta pela HCTECH é a utilização de
                - strong [ref=f4e91]: dois estatores
                - text: . Cada estator possui seu próprio sistema de enrolamento, permitindo que a máquina seja projetada para trabalhar com
                - strong [ref=f4e92]: duas tensões de saída simultâneas
                - text: ", conforme a configuração elétrica desenvolvida para cada aplicação. Isso abre possibilidades para aplicações que necessitam alimentar sistemas com diferentes níveis de tensão utilizando um único equipamento. A proposta busca reduzir a dependência de equipamentos adicionais de transformação de tensão em determinadas configurações."
              - heading [level=3] [ref=f4e93]:
                - strong [ref=f4e94]: "CONCEITO:"
                - link "#" [ref=f4e95] [cursor=pointer]:
                  - /url: "#conceito"
              - paragraph [ref=f4e96]:
                - strong [ref=f4e97]: UM ÚNICO EQUIPAMENTO
              - paragraph [ref=f4e98]: ↓
              - paragraph [ref=f4e99]:
                - strong [ref=f4e100]: DOIS ESTATORES
              - paragraph [ref=f4e101]: ↓
              - paragraph [ref=f4e103]:
                - strong [ref=f4e104]: DOIS SISTEMAS DE ENROLAMENTO
              - paragraph [ref=f4e105]: ↓
              - paragraph [ref=f4e106]:
                - strong [ref=f4e107]: DUAS TENSÕES DISPONÍVEIS SIMULTANEAMENTE
              - paragraph [ref=f4e108]: "O potencial impacto dessa arquitetura inclui:"
              - list [ref=f4e109]:
                - listitem [ref=f4e110]: Simplificação da instalação;
                - listitem [ref=f4e111]: Redução da quantidade de equipamentos auxiliares;
                - listitem [ref=f4e112]: Menor ocupação física do sistema;
                - listitem [ref=f4e113]: Possibilidade de integração de diferentes cargas;
                - listitem [ref=f4e114]: Maior flexibilidade operacional;
                - listitem [ref=f4e115]: Simplificação da arquitetura elétrica em aplicações específicas.
              - paragraph [ref=f4e116]: A configuração elétrica definitiva e os níveis de tensão serão definidos e validados de acordo com a aplicação do equipamento.
