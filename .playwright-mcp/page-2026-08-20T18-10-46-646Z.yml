            - strong [ref=f2e68]: Manufatura Industrial e Desenvolvimento de Protótipos
          - paragraph [ref=f2e69]: • Manufatura industrial 4.0 e IA aplicada . • Soluções integradas que geram valor em todo o ciclo operacional dos ativos.
