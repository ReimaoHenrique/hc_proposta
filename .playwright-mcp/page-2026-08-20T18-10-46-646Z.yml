            - text: A
            - strong [ref=f2e46]: HCTECH
            - text: encontra-se atualmente em fase estratégica de desenvolvimento tecnológico, com foco na
            - strong [ref=f2e47]: construção, usinagem, fabricação e montagem dos primeiros protótipos funcionais
            - text: de sua tecnologia de
            - strong [ref=f2e48]: Indução por Sobrepolos
            - text: .
          - paragraph [ref=f2e49]:
            - text: O desafio da HCTECH vai além do desenvolvimento de um novo equipamento. Nossa proposta é atuar na interseção entre
            - strong [ref=f2e50]: engenharia mecânica e elétrica avançada, novos materiais, manufatura industrial, automação, conectividade digital e inteligência artificial aplicada
            - text: ", buscando desenvolver soluções capazes de ampliar os limites tradicionais de eficiência, desempenho, confiabilidade e manutenção dos sistemas de conversão de energia."
          - paragraph [ref=f2e51]:
            - text: A estratégia da empresa está orientada para mercados globais e aplicações de alto valor agregado. Inicialmente, a HCTECH pretende estruturar sua capacidade de manufatura em pontos estratégicos das Américas, com presença planejada no
            - strong [ref=f2e52]: Paraguai
            - text: e nos
            - strong [ref=f2e53]: Estados Unidos
            - text: .
          - paragraph [ref=f2e54]:
            - text: Essa estratégia busca combinar
            - strong [ref=f2e55]: competitividade produtiva, eficiência tributária, proximidade logística, acesso a mercados maduros e capacidade de expansão internacional
            - text: .
          - paragraph [ref=f2e56]:
            - text: "A visão da HCTECH é construir uma plataforma tecnológica capaz de integrar não apenas o equipamento principal, mas também todo o seu ecossistema operacional:"
            - strong [ref=f2e57]: monitoramento, controle, manutenção modular, diagnóstico, conectividade e inteligência aplicada à operação dos ativos
            - text: .
          - paragraph [ref=f2e58]:
            - strong [ref=f2e59]: Engenharia Avançada e Indução por Sobrepolos
          - paragraph [ref=f2e60]:
            - text: "---Desenvolvimento de uma nova arquitetura tecnológica baseada no conceito de"
            - strong [ref=f2e62]: Indução por Sobrepolos
            - text: ", explorando novas possibilidades para motores, geradores e sistemas de conversão de energia."
          - paragraph [ref=f2e63]:
            - strong [ref=f2e64]: "O objetivo é combinar soluções que combinem:"
          - paragraph [ref=f2e65]:
